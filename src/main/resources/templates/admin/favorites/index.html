<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head th:replace="fragments :: head"></head>
<body>

<header>
    <div th:replace="fragments :: nav"></div>
</header>

<div class="container body-content py-4">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-3">
        <div>
            <h1>My Favorites</h1>
            <p class="text-muted mb-0">Recipes you want to come back to.</p>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/recipeList}">Browse Recipes</a>
    </div>

    <p th:if="${message}" th:text="${message}" th:class="${class}"></p>

    <div th:if="${#lists.isEmpty(favorites)}" class="border rounded p-5 text-center bg-light">
        <i class="bi bi-heart fs-1 text-muted"></i>
        <h4 class="mt-3">No favorites yet</h4>
        <p class="text-muted">Open a recipe and select Add to Favorites.</p>
    </div>

    <div th:unless="${#lists.isEmpty(favorites)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="favorite : ${favorites}">
            <div class="card border shadow-sm h-100">
                <a th:href="@{'/recipe/' + ${favorite.recipe.id}}">
                    <img th:if="${favorite.recipe.image != null}"
                         th:src="@{'/uploads/' + ${favorite.recipe.image}}"
                         class="card-img-top recipe-card-image"
                         th:alt="${favorite.recipe.name}">
                </a>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a th:href="@{'/recipe/' + ${favorite.recipe.id}}"
                           th:text="${favorite.recipe.name}"
                           class="text-reset text-decoration-none fw-bolder"></a>
                    </h5>
                    <p class="card-text" th:text="${#strings.abbreviate(favorite.recipe.description, 100)}"></p>
                    <form method="post" th:action="@{/admin/favorites/remove}" class="mt-auto">
                        <input type="hidden" name="recipeId" th:value="${favorite.recipe.id}">
                        <input type="hidden" name="returnTo" value="favorites">
                        <button type="submit" class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-heart-fill"></i> Remove
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments :: footer"></footer>

</body>
</html>
